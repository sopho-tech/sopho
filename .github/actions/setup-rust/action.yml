name: Set up Rust
description: Installs the pinned Rust toolchain, the cargo tools and the build cache
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: backend
      run: rustup toolchain install
    - name: Install protoc and the cargo tools
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: protoc,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-shear
    - name: Cache the build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: backend -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}
