name: Set up Rust
description: Installs the pinned Rust toolchain, the cargo tools and the build cache
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: backend
      run: rustup toolchain install
    - name: Install protoc and the cargo tools
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: protoc,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-shear
    - name: Cache the build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: backend -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}
