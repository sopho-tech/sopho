name: Install Chromium
description: Installs the Playwright Chromium browser for one package
inputs:
  directory:
    description: Directory whose installed Playwright version decides which Chromium to install
    required: true
runs:
  using: composite
  steps:
    # No --with-deps: the runner image already has Chromium's libraries, and the
    # apt install of extra fonts fails whenever the Ubuntu mirrors are down.
    - name: Install Chromium
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: npx --no-install playwright install chromium
