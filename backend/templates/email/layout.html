<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f1f24; font-size: 15px; line-height: 1.5">
    <div style="max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 32px">
      <p style="margin: 0 0 24px; font-size: 20px; font-weight: 600">Sopho</p>
      {% block content %}{% endblock %}
      <p style="margin: 32px 0 0; font-size: 12px; color: #6b6b76">{% block reason %}{% endblock %}</p>
    </div>
  </body>
</html>
