<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #e8e8fc">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #e8e8fc; font-size: 1px; line-height: 1px">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #e8e8fc; background-image: linear-gradient(160deg, #fcfcfd 0%, #e8e8fc 45%, #c6bcfb 100%)">
      <tr>
        <td align="center" style="padding: 48px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 520px">
            <tr>
              <td align="center" style="padding: 0 0 24px">
                <img src="cid:sopho-logo" width="56" height="56" alt="Sopho" style="display: block; width: 56px; height: 56px; border: 0" />
              </td>
            </tr>
            <tr>
              <td align="center" style="background-color: #fcfcfd; border: 1px solid #dad9dd; border-radius: 16px; padding: 40px 32px; font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #29272b">
                <p style="margin: 0 0 12px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #5c50b4">{% block eyebrow %}{% endblock %}</p>
                <h1 style="margin: 0 0 12px; font-size: 26px; line-height: 34px; font-weight: 600; color: #383350">{% block heading %}{% endblock %}</h1>
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 24px 24px 0; font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 18px; color: #63616b">
                {% block reason %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
