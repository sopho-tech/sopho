[package]
name = "migration"
version = "0.1.7"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }

[dependencies.sea-orm-migration]
version = "1.1.19"
features = [
  "sqlx-mysql",
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-async-std-native-tls",
]
