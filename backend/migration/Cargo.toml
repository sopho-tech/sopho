[package]
name = "migration"
version = "0.1.7"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm-migration = {
  version = "1.1.19",
  features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "sqlx-sqlite",
  ]
}
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
