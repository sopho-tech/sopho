[package]
name = "migration"
version = "0.1.7"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
sea-orm-migration = {
  version = "1.1.19",
  features = [
    "runtime-async-std-native-tls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
  ]
}

[lints]
workspace = true
