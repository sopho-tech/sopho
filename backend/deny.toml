[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa comes from openidconnect, which has no release on rsa 0.10; Sopho only verifies ID token signatures and holds no RSA private key" },
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar comes from testcontainers, a dev-dependency with no release that drops it" },
  { id = "RUSTSEC-2026-0459", reason = "sqlx-sqlite 0.9.0 caps libsqlite3-sys below 0.38; the flaw needs a crafted database and WAL file already on the server" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "aws-lc-sys"
allow = ["OpenSSL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
