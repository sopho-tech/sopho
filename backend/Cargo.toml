[package]
name = "sopho"
version = "0.1.0"
edition = "2024"
authors = ["Athul T R <athultr1997@gmail.com>"]
description = "Open-source analytics platform"
license = "AGPL-3.0"
publish = false

[workspace]
members = [".", "fake-llm", "migration"]

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.97"
argon2 = "0.5.3"
axum = { version = "0.8.1", features = ["json"] }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.2"
hex = "0.4"
http = "1.3.1"
indoc = "2.0.7"
migration = { path = "migration" }
reqwest = "0.12.15"
rig-core = "0.32.0"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
schemars = { version = "1.2", features = ["derive"] }
sea-orm = { version = "1.1.19", features = ["debug-print", "macros", "runtime-tokio-native-tls", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "sqlite"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "=2.0.12"
time = "0.3.47"
tokio = { version = "1.44.2", features = ["full"] }
tokio-cron-scheduler = { version = "0.15.1", features = ["postgres_storage"] }
tokio-stream = { version = "0.1.18" }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.2", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.4", features = ["serde", "v4"] }

[lints]
workspace = true
