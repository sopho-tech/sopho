services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/sopho
      - SOPHO_FRONTEND_DIR=/app/frontend/dist/
      - SOPHO_ENVIRONMENT=production
      - SOPHO_COOKIE_SECURE=false
      - SOPHO_ADMIN_USERNAME=admin
      - SOPHO_ADMIN_PASSWORD=password
      - SOPHO_ADMIN_EMAIL=admin@admin.com
      - SOPHO_ADMIN_FULL_NAME=admin admin
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
